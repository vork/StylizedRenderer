[project]
name = "inkforge"
version = "0.1.0"
description = "A native Slang stylized PBR renderer"
requires-python = ">=3.10,<3.14"
dependencies = ["slangpy==0.43.1", "numpy>=2.2", "Pillow>=11", "pygltflib==1.16.5", "usd-core>=25.5"]

[project.optional-dependencies]
test = ["pytest>=8"]
app = ["pyinstaller>=6.20,<7"]

[project.scripts]
inkforge = "inkforge.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
inkforge = ["shaders/*.slang", "resources/*.png"]

[tool.setuptools.packages.find]
include = ["inkforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
